services:
  app:
    image: ghcr.io/kdt-solutions/outreach:latest
    pull_policy: always
    container_name: outreach-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://outreach:${POSTGRES_PASSWORD}@db:5432/outreach
      - SECRET_KEY=${SECRET_KEY}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_TOKEN=${API_TOKEN}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY:-}
      - SMTP2GO_API_KEY=${SMTP2GO_API_KEY:-}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-}
      - TZ=${TZ:-Europe/Zurich}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8429}:8000"

  worker:
    image: ghcr.io/kdt-solutions/outreach:latest
    pull_policy: always
    container_name: outreach-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://outreach:${POSTGRES_PASSWORD}@db:5432/outreach
      - SECRET_KEY=${SECRET_KEY}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_TOKEN=${API_TOKEN}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY:-}
      - SMTP2GO_API_KEY=${SMTP2GO_API_KEY:-}
      - TZ=${TZ:-Europe/Zurich}
      - WORKER_INTERVAL_SECONDS=${WORKER_INTERVAL_SECONDS:-60}

  # Automation API without browser login: REST under /api/v1, MCP under /mcp.
  # Route https://<host>/api/v1 and https://<host>/mcp to this port in the reverse proxy.
  outreach-mcp:
    image: ghcr.io/kdt-solutions/outreach:latest
    pull_policy: always
    container_name: outreach-mcp
    restart: unless-stopped
    command: ["uvicorn", "app.api_server:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://outreach:${POSTGRES_PASSWORD}@db:5432/outreach
      - SECRET_KEY=${SECRET_KEY}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SMTP2GO_API_KEY=${SMTP2GO_API_KEY:-}
      - TZ=${TZ:-Europe/Zurich}
      # set as a stack variable (Portainer) or in .env, never in the repo
      - OUTREACH_API_TOKEN=${OUTREACH_API_TOKEN}
      - OUTREACH_API_TENANTS=${OUTREACH_API_TENANTS}
      - OUTREACH_API_ALLOW_IPS=${OUTREACH_API_ALLOW_IPS:-}
      - OUTREACH_API_RATE_LIMIT=${OUTREACH_API_RATE_LIMIT:-60}
      - OUTREACH_TEST_ALLOW_DOMAINS=${OUTREACH_TEST_ALLOW_DOMAINS:-}
      - OUTREACH_MCP_ALLOWED_HOSTS=${OUTREACH_MCP_ALLOWED_HOSTS:-}
      # which proxies may set X-Forwarded-For/-Proto; use the proxy's IP when the IP allowlist is on
      - FORWARDED_ALLOW_IPS=${MCP_FORWARDED_ALLOW_IPS:-*}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MCP_HOST_PORT:-8430}:8000"

  db:
    image: postgres:16-alpine
    container_name: outreach-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=outreach
      - POSTGRES_USER=outreach
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - outreach-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreach"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  outreach-db:
